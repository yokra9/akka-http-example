name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Install sbt
      run: |
        curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo gpg --dearmor -o /etc/apt/keyrings/scalasbt.gpg
        echo "deb [signed-by=/etc/apt/keyrings/scalasbt.gpg] https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
        sudo apt-get update
        sudo apt-get install sbt

    - name: Run tests and create coverage report
      run: sbt "clean;coverageOn;test;coverageReport"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: scoverage-report
        path: target/out/jvm/scala-*/akka-http-example/scoverage-report/

    - name: Build assembly jar
      run: sbt "clean;assembly"